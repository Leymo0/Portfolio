<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Living Dex Journey — Leymo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12142a; --panel:#1b1e3a; --panel2:#232750; --line:rgba(255,255,255,.08);
  --text:#e9ebff; --muted:#9aa0c8; --accent:#ff6b6b; --accent2:#ffd166; --good:#5ee0a0; --bad:#ff5d73; --home:#7cc4ff; --via:#b98cff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--text)}
body.control{background:var(--bg);color-scheme:dark}
a.btn{color:var(--text);text-decoration:none}
body.overlay{background:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- CONTROL ---------- */
header{position:sticky;top:0;z-index:5;background:rgba(18,20,42,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;letter-spacing:.3px}
.brand span{color:var(--accent)}
.total{color:var(--muted);font-size:13px}
.bank{margin-left:auto;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,93,115,.15);color:#ffb3bf;border:1px solid rgba(255,93,115,.35)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.tab small{color:var(--muted);font-weight:700}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1a1020}
.tab.on small{color:#3b1a22}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tab .dot.done{background:var(--good)}
.tab .dot.ds{background:#ffb3bf}
main{padding:14px;display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.gname{font-size:20px;font-weight:900;margin:0}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin:6px 6px 0 0}
.chip.warn{background:rgba(255,93,115,.18);color:#ffb3bf}
.small{font-size:13px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:800;font-size:13px}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1020}
input[type=number],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
input[type=number]{width:80px}
.capbox{display:flex;gap:12px;align-items:stretch;margin:4px 0 10px}
.capbig{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.capbig .lbl{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.capbig .val{font-size:26px;font-weight:900}
.status{font-weight:900;border-radius:10px;padding:8px 10px;text-align:center;margin-top:8px}
.status.ok{background:rgba(94,224,160,.15);color:var(--good)}
.status.over{background:rgba(255,93,115,.18);color:var(--bad)}
.boss{display:grid;grid-template-columns:22px 1fr 64px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px}
.boss.next{background:rgba(255,209,102,.12);outline:1px solid rgba(255,209,102,.4)}
.boss.beat .bn{text-decoration:line-through;color:var(--muted)}
.boss input[type=number]{width:64px;padding:4px 6px}
.boss input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.bosses{max-height:360px;overflow:auto;margin-top:6px}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--accent2)} .bar .h{background:var(--home)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters .btn.on{background:var(--accent2);color:#2a2000;border-color:var(--accent2)}
.fam{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2);margin-bottom:8px;flex-wrap:wrap}
.fam .need{min-width:150px;font-weight:900;font-size:14px}
.fam .need small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.mons{display:flex;gap:6px;flex-wrap:wrap}
.mon{width:84px;border-radius:10px;background:var(--bg);border:2px solid transparent;padding:4px;text-align:center;cursor:pointer;position:relative;user-select:none}
.mon img{width:56px;height:56px;image-rendering:pixelated;filter:grayscale(1) brightness(.55);opacity:.7}
.mon .nm{font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .no{font-size:10px;color:var(--muted)}
.mon.s1{border-color:var(--accent2)} .mon.s1 img{filter:none;opacity:1}
.mon.s2{border-color:var(--home)} .mon.s2 img{filter:none;opacity:1}
.mon .tag{position:absolute;top:3px;right:3px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.mon .tag.M{background:rgba(255,93,115,.25);color:#ffb3bf}
.mon .tag.L{background:rgba(255,209,102,.2);color:var(--accent2)}
.mon .tag.D{background:rgba(124,196,255,.2);color:var(--home)}
.mon .st{position:absolute;top:3px;left:3px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:5px}
.mon.s1 .st{background:var(--accent2);color:#2a2000}
.mon.s2 .st{background:var(--home);color:#06223a}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:6px 0}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.shinyrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.shinyrow img{width:56px;height:56px;image-rendering:pixelated}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
ol.help{padding-left:18px;margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.55}

/* ---------- OVERLAY ---------- */
.ov{width:440px;margin:10px;padding:14px 16px 12px;border-radius:18px;background:rgba(18,20,42,.86);border:2px solid rgba(255,107,107,.55);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.ov-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ov-region{font-weight:900;font-size:22px;letter-spacing:.5px}
.ov-region span{color:var(--accent)}
.ov-game{font-size:13px;color:var(--muted);font-weight:800;text-align:right}
.ov-sec{margin-top:10px}
.ov-lbl{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.ov-dexnum{font-weight:900;font-size:18px}
.ov-dexnum small{font-size:12px;color:var(--muted);font-weight:800}
.ov-cap{display:flex;gap:8px;align-items:center}
.ov-cap .boss-n{flex:1;font-weight:900;font-size:16px;line-height:1.15}
.ov-cap .boss-n small{display:block;font-size:12px;color:var(--muted)}
.ov-pill{font-weight:900;font-size:15px;padding:6px 10px;border-radius:12px;background:var(--panel2);text-align:center;line-height:1.1}
.ov-pill small{display:block;font-size:10px;color:var(--muted);letter-spacing:.8px}
.ov-pill.ok{background:rgba(94,224,160,.18);color:var(--good)}
.ov-pill.over{background:rgba(255,93,115,.22);color:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,93,115,.25)}}
.ov-bottom{display:flex;gap:10px;align-items:center;margin-top:10px}
.ov-bottom img{width:48px;height:48px;image-rendering:pixelated}
.ov-mini{flex:1;font-size:13px;font-weight:800}
.ov-mini small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.ov-bank{margin-top:8px;font-size:12px;font-weight:900;color:#ffb3bf;text-align:center}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.how{margin-top:8px;display:grid;gap:3px;width:100%}
.how div{font-size:12px;color:var(--muted);line-height:1.35}
.how b{color:var(--text);font-weight:800}
.k{display:inline-block;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;margin-right:4px;vertical-align:1px}
.k.wild{background:rgba(94,224,160,.15);color:var(--good)}
.k.evolve,.k.breed{background:rgba(255,255,255,.08);color:var(--text)}
.k.trade{background:rgba(124,196,255,.18);color:var(--home)}
.k.exclusive,.k.none{background:rgba(255,93,115,.2);color:#ffb3bf}
.k.event{background:rgba(255,93,115,.2);color:#ffb3bf}
.k.special,.k.dlc{background:rgba(255,209,102,.18);color:var(--accent2)}
.mon.cant img{opacity:.35}
.cantlist{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 0 8px}
.cantlist b{color:var(--text)}
table.rw{width:100%;border-collapse:collapse;font-size:12px}
table.rw td{padding:4px 2px;border-top:1px solid var(--line);color:var(--muted);vertical-align:top}
table.rw td:last-child{color:var(--accent2);font-weight:800;text-align:right;white-space:nowrap}
select.var{width:auto;margin-top:8px}
.hrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.hrow img,.hrow .himg{width:40px;height:40px;flex:0 0 40px;image-rendering:pixelated}
.hrow input[type=text]{padding:5px 8px;min-width:0}
.hlab{flex:0 0 64px;font-size:12px;font-weight:900;color:var(--muted)}
.hlab.hi{color:var(--accent2)}
.hsh{display:flex;align-items:center;gap:2px;font-size:13px;cursor:pointer}
.hsh input{accent-color:var(--accent2)}
.hf{width:860px;margin:10px;padding:18px 20px;border-radius:20px;background:rgba(18,20,42,.9);border:2px solid rgba(255,209,102,.6)}
.hf-title{font-size:26px;font-weight:900}
.hf-game{color:var(--muted);font-weight:800;font-size:14px}
.hf-team{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.hf-slot{background:var(--panel2);border-radius:14px;padding:8px 6px 10px;text-align:center;border:2px solid transparent}
.hf-slot.mvp{border-color:var(--accent2);background:rgba(255,209,102,.12)}
.hf-slot img,.hf-empty{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto}
.hf-empty{line-height:96px;font-size:30px;color:var(--muted)}
.hf-tag{font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--accent2)}
.hf-nick{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hf-sp{font-size:11px;color:var(--muted);font-weight:800;min-height:14px}
.hf-hml{margin-top:14px;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hf-hms{display:flex;gap:10px;margin-top:6px}
.hf-hm{flex:1;display:flex;gap:6px;align-items:center;background:var(--panel2);border-radius:12px;padding:6px 10px;font-size:14px}
.hf-hm img{width:48px;height:48px;image-rendering:pixelated}
.hf-hm span{color:var(--muted);font-size:12px}
.hf-hm small{display:block;color:var(--muted);font-size:12px}
.hf.hf-pub{width:auto;margin:0 0 14px}
.hf.hf-pub .hf-team{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.hf.hf-pub .hf-hms{flex-wrap:wrap}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.pfam{display:flex;gap:4px;padding:6px;border-radius:12px;background:var(--panel2)}
.small.err{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.overlay .bk{position:absolute;left:0;top:0}
.bk{width:1920px;height:1080px;transform-origin:0 0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 20% 0%,#2a1f4a 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#3a1630 0%,transparent 50%),#12142a;color:var(--text)}
.bk-stage{position:absolute;inset:0 0 170px 0}
.bk-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bk-slide.in{animation:bkin .9s ease both}.bk-slide.out{animation:bkout .9s ease both}
@keyframes bkin{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bkout{to{opacity:0;transform:translateY(-30px) scale(.98)}}
.bk-center{text-align:center}
.bk-kicker{font-size:34px;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:var(--accent)}
.bk-big{font-size:150px;font-weight:900;line-height:1.05;margin:10px 0 30px;animation:bkpulse 3s ease-in-out infinite}
@keyframes bkpulse{50%{transform:scale(1.02)}}
.bk-stats{display:flex;gap:70px;justify-content:center}
.bk-stats div{display:flex;flex-direction:column}
.bk-stats b{font-size:76px;font-weight:900;color:var(--accent2)}
.bk-stats span{font-size:24px;color:var(--muted);font-weight:800}
.bk-now{margin-top:34px;font-size:30px;color:var(--muted);font-weight:800}
.bk-now b{color:var(--text)}
.bk-url{font-size:110px;font-weight:900;margin:16px 0;color:var(--text)}
.bk-wrap{width:1700px}
.bk-h{font-size:46px;font-weight:900;margin-bottom:26px;text-align:center}
.bk-regions{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.bk-reg{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:22px}
.bk-ic{position:absolute;right:12px;top:6px;width:84px;height:84px;image-rendering:pixelated;opacity:.9;transform-origin:50% 90%}
.bk-ic.dim{filter:grayscale(1) brightness(.45);opacity:.55}
.bk-reg .bar i{animation:bkfill 1.5s cubic-bezier(.3,.7,.3,1) var(--d) both}
@keyframes bkfill{from{width:0}}
.bk-reg.done{animation:bkpop .6s cubic-bezier(.2,1.6,.4,1) var(--pd) both;border-color:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.18),0 0 34px rgba(255,209,102,.35)}
@keyframes bkpop{0%{transform:none}40%{transform:scale(1.09)}100%{transform:none}}
.bk-reg.done .bk-ic{opacity:1;animation:bkdance 1.1s ease-in-out calc(var(--pd) + .5s) infinite}
@keyframes bkdance{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-12px) rotate(-8deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-6px) rotate(8deg)}80%{transform:translateY(0) rotate(0)}}
.bk-done{position:absolute;left:50%;top:50%;z-index:2;padding:6px 18px;border-radius:12px;background:#ffd166;color:#1a1530;font-size:30px;font-weight:900;letter-spacing:.06em;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:bkstamp .55s cubic-bezier(.2,1.6,.4,1) var(--pd) both;transform:translate(-50%,-50%) rotate(-8deg)}
@keyframes bkstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.bk-reg.on{border-color:var(--accent)}
.bk-rn{font-size:32px;font-weight:900}
.bk-rg{font-size:18px;color:var(--muted);font-weight:800;margin:2px 0 14px;min-height:24px}
.bk-reg .bar{height:16px}
.bk-rc{font-size:26px;font-weight:900;margin-top:10px;color:var(--accent2)}
.bk-hofwrap{display:flex;justify-content:center}
.hf.hf-break{width:1500px;margin:0;padding:30px 34px;transform:none}
.hf.hf-break .hf-title{font-size:48px}.hf.hf-break .hf-game{font-size:24px}
.hf.hf-break .hf-slot img,.hf.hf-break .hf-empty{width:170px;height:170px;line-height:170px}
.hf.hf-break .hf-nick{font-size:28px}.hf.hf-break .hf-sp{font-size:18px}.hf.hf-break .hf-tag{font-size:18px}
.hf.hf-break .hf-hm{font-size:22px}.hf.hf-break .hf-hml{font-size:18px}.hf.hf-break .hf-hm img{width:72px;height:72px}
.bk-shinies{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.bk-sh{width:255px;background:var(--panel);border-radius:18px;padding:16px;text-align:center}
.bk-sh img{width:150px;height:150px;image-rendering:pixelated;display:block;margin:0 auto}
.bk-sh b{display:block;font-size:24px}.bk-sh span{font-size:16px;color:var(--muted);font-weight:800}
.bk-mq{position:absolute;left:0;right:0;bottom:40px;height:120px;overflow:hidden;background:rgba(0,0,0,.25);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.bk-mqi{display:flex;width:max-content;animation:bkmq linear infinite}
.bk-mqi img{width:120px;height:120px;image-rendering:pixelated;margin:0 4px}
.bk-mqi img.dance{animation:bkdance 1.1s ease-in-out infinite;transform-origin:50% 90%}
.bk-mqi img.dim{filter:grayscale(1) brightness(.4);opacity:.6}
@keyframes bkmq{to{transform:translateX(-50%)}}
.bk-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.bk-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.bk-dots i.on{background:var(--accent)}
.mon.via{border-color:var(--via)} .mon.via img{filter:none;opacity:1}
.mon.via .st{background:var(--via);color:#1d0b38}
details.cu summary{cursor:pointer;list-style:none} details.cu summary::-webkit-details-marker{display:none}
details.cu summary h2::before{content:'▸ ';color:var(--muted)} details.cu[open] summary h2::before{content:'▾ '}
.culist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:8px}
.curow{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:6px}
.mon.later{border:2px dashed var(--via)} .mon.later img{filter:grayscale(.6) brightness(.8);opacity:.85}
.mon.later .st{background:transparent;color:var(--via);border:1px solid var(--via)}
.k.later{background:rgba(185,140,255,.18);color:var(--via)}

.toast{position:fixed;top:18px;right:18px;z-index:99;display:flex;gap:12px;align-items:center;min-width:300px;max-width:420px;padding:12px 16px 12px 12px;border-radius:18px;background:linear-gradient(135deg,rgba(30,24,60,.97),rgba(18,20,42,.97));border:2px solid #ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.18),0 12px 40px rgba(0,0,0,.55);animation:tin .55s cubic-bezier(.2,1.4,.4,1) both;color:var(--text)}
.toast.on-ov{left:10px;right:auto;top:10px;width:440px;max-width:440px;box-sizing:border-box}
.toast.shiny{border-color:#b98cff;box-shadow:0 0 0 4px rgba(185,140,255,.25),0 0 30px rgba(185,140,255,.5),0 12px 40px rgba(0,0,0,.55)}
.toast.out{animation:tout .5s ease-in both}
.toast .tic{flex:0 0 64px;height:64px;border-radius:14px;background:rgba(255,255,255,.06);display:grid;place-items:center;animation:tbob 1.2s ease-in-out infinite}
.toast .tic img{width:64px;height:64px;image-rendering:pixelated}.toast .tic span{font-size:34px}
.toast .ttx{display:flex;flex-direction:column;min-width:0}
.toast .ttx small{font-size:11px;letter-spacing:.12em;font-weight:800;color:#ffd166}.toast.shiny .ttx small{color:#d7b8ff}
.toast .ttx b{font-size:22px;line-height:1.15}.toast .ttx span{font-size:14px;color:var(--muted)}
.tconf{position:absolute;left:50%;top:50%;pointer-events:none}
.tconf i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:tpop 1.3s ease-out var(--d) both}
@keyframes tin{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-20px) scale(.95);opacity:0}}
@keyframes tbob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes tpop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 220px)) rotate(var(--r))}}

.tabsep{flex:0 0 2px;align-self:stretch;background:var(--line);margin:0 4px;border-radius:2px}
.pub-hero .bk-stats{display:flex;justify-content:center;gap:60px;margin:6px 0 10px}
.pub-hero .bk-stats b{display:block;font-size:46px;font-weight:900;color:var(--accent2);text-align:center}.pub-hero .bk-stats span{display:block;color:var(--muted);font-weight:800;text-align:center}
.pub-regions .bk-regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:14px 0}
.pub-regions .bk-reg{padding:16px;cursor:pointer;transition:transform .15s}.pub-regions .bk-reg:hover{transform:translateY(-3px)}
.pub-regions .bk-rn{font-size:24px}.pub-regions .bk-rg{font-size:14px;margin-bottom:10px}.pub-regions .bk-rc{font-size:20px}.pub-regions .bk-ic{width:64px;height:64px}
.pub-regions .bk-reg .bar{height:12px}.pub-regions .bk-done{font-size:20px;padding:4px 12px}
.pub-shinies{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pub-sh{background:rgba(185,140,255,.08);border:1px solid rgba(185,140,255,.35);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.pub-sh img{width:96px;height:96px;image-rendering:pixelated}.pub-sh b{font-size:17px}.pub-sh span{font-size:12px;color:var(--muted)}
.pub-ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pub-a{display:flex;gap:12px;align-items:center;background:rgba(255,209,102,.06);border:1px solid rgba(255,209,102,.35);border-radius:16px;padding:10px 14px}
.pub-a.shiny{background:rgba(185,140,255,.08);border-color:rgba(185,140,255,.4)}
.pub-a img{width:56px;height:56px;image-rendering:pixelated}.pub-a .pi{font-size:34px;width:56px;text-align:center}
.pub-a div{display:flex;flex-direction:column}.pub-a b{font-size:16px}.pub-a span{font-size:13px;color:var(--muted)}.pub-a small{font-size:11px;color:var(--muted);opacity:.8}
@media(max-width:700px){.pub-hero .bk-stats{gap:18px;flex-wrap:wrap}.pub-hero .bk-stats b{font-size:32px}}

// ---------- data prep ----------
const SP = {}; SPECIES.forEach(([num,name,root,prevo,tag]) => SP[num] = {num,name,root,prevo,tag});
function depth(n){let d=0,s=SP[n];while(s&&s.prevo){d++;s=SP[s.prevo];}return d;}
function regionOf(n){return REGIONS.find(r=>n>=r.range[0]&&n<=r.range[1]);}
REGIONS.forEach(r=>{
  const fams={};
  for(let n=r.range[0];n<=r.range[1];n++){ if(!SP[n]) continue; (fams[SP[n].root] ||= []).push(n); }
  r.families = Object.values(fams).map(members=>{
    members.sort((a,b)=>depth(a)-depth(b)||a-b);
    const first = SP[members[0]];
    let base = first, evolve = false;
    if(first.prevo && first.prevo < r.range[0]){ let s=first; while(s.prevo && s.prevo < r.range[0]) s=SP[s.prevo]; base=s; evolve=true; }
    return {members, base:base.num, evolve, minNum:Math.min(...members)};
  }).sort((a,b)=>a.minNum-b.minNum);
  r.total = r.range[1]-r.range[0]+1;
});

function blankHof(){return {team:Array.from({length:6},()=>({mon:'',nick:'',shiny:false})),hm:Array.from({length:3},()=>({mon:'',nick:'',note:''})),date:''};}
function blankRegion(){return {bv:{},team:'',shinies:[],variant:null,hof:blankHof()};}
function blank(){
  const s={active:'kanto',dex:{},via:{},pick:{},regions:{},overlay:{dex:true,cap:true,shiny:true,bank:true,last:true},last:null,filter:'all',search:''};
  REGIONS.forEach(r=>s.regions[r.id]=blankRegion());

function cantSummary(r){
  const groups={exclusive:[],event:[],none:[],later:[]};
  for(let n=r.range[0];n<=r.range[1];n++){const k=unpicked(r,n)?'later':how(r,n)[0]; if(groups[k]) groups[k].push(SP[n].name+(S.dex[n]&&S.via[n]?' ✓':''));}
  const g=V(r), parts=[];
  if(groups.exclusive.length) parts.push(`<div class="cantlist"><b>Other version only (${groups.exclusive.length}):</b> ${groups.exclusive.map(esc).join(', ')}</div>`);
  if(groups.event.length) parts.push(`<div class="cantlist"><b>Event only (${groups.event.length}):</b> ${groups.event.map(esc).join(', ')}</div>`);
  if(groups.later.length) parts.push(`<div class="cantlist"><b>Not your pick (${groups.later.length}):</b> ${groups.later.map(esc).join(', ')}</div>`);
  if(groups.none.length) parts.push(`<div class="cantlist"><b>Not in ${esc(g.game)} (${groups.none.length}):</b> ${groups.none.map(esc).join(', ')}</div>`);
  return parts.join('')||'<p class="small">Everything from this region can be obtained in this game. 🎉</p>';
}

// ---------- website publishing (GitHub) ----------
const GH={repo:'Leymo0/Portfolio',path:'livingdex/progress.json',branch:'main',tokenKey:'livingdex-gh-token',metaKey:'livingdex-gh-meta'};
function makePub(){ const pub={updated:new Date().toISOString(),active:S.active,dex:S.dex,via:S.via,pick:S.pick,ach:S.ach||{},regions:{}}; for(const id in S.regions){ const x=S.regions[id]; pub.regions[id]={variant:x.variant,bv:x.bv,shinies:x.shinies,hof:x.hof,team:x.team}; } return pub; }
function ghToken(){ try{return localStorage.getItem(GH.tokenKey)||'';}catch(e){return '';} }
function ghMeta(){ try{return JSON.parse(localStorage.getItem(GH.metaKey)||'{}');}catch(e){return {};} }
function ghSetMeta(m){ try{localStorage.setItem(GH.metaKey,JSON.stringify(Object.assign(ghMeta(),m)));}catch(e){} }
function pubSignature(){ const p=makePub(); delete p.updated; return JSON.stringify(p); }
let publishing=false;
async function publishNow(auto){
  const token=ghToken(); if(!token||publishing) return;
  publishing=true; ghSetMeta({status:'Publishing…'}); if(VIEW==='control') refreshPublishStatus();
  const sig=pubSignature();
  try{
    const api=`https://api.github.com/repos/${GH.repo}/contents/${GH.path}`;
    const hdr={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    let sha;
    const g=await fetch(api+'?ref='+GH.branch+'&t='+Date.now(),{headers:hdr,cache:'no-store'});
    if(g.status===200){ sha=(await g.json()).sha; } else if(g.status!==404){ throw new Error(g.status===401?'GitHub rejected the key (expired or wrong?)':g.status===403||g.status===404?'The key can\'t access Leymo0/Portfolio — check its repository and Contents permission':'GitHub error '+g.status); }
    const json=JSON.stringify(makePub());
    const body={message:(auto?'Auto-update':'Update')+' living dex progress',content:btoa(unescape(encodeURIComponent(json))),branch:GH.branch}; if(sha) body.sha=sha;
    const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),body:JSON.stringify(body)});
    if(!p.ok){ throw new Error(p.status===401?'GitHub rejected the key (expired or wrong?)':p.status===403||p.status===404?'The key needs Contents: Read and write on Leymo0/Portfolio':'GitHub error '+p.status); }
    ghSetMeta({status:'ok',last:Date.now(),sig});
  }catch(err){ ghSetMeta({status:'Error: '+(err.message||err)}); }
  publishing=false; if(VIEW==='control') refreshPublishStatus();
}
let autoTimer=null;
function scheduleAuto(){ if(VIEW!=='control'||!ghToken()||!ghMeta().auto) return; clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(pubSignature()!==ghMeta().sig) publishNow(true); },120000); }
function publishStatusText(){ const m=ghMeta(); if(!ghToken()) return 'Not connected.'; if(publishing||m.status==='Publishing…') return 'Publishing…'; if(m.status&&m.status!=='ok') return m.status; if(m.last){ const dirty=pubSignature()!==m.sig; return `Last published ${new Date(m.last).toLocaleTimeString()}${dirty?' · new changes not published yet':' · up to date ✓'}`; } return 'Connected. Not published yet.'; }
function refreshPublishStatus(){ const el=document.getElementById('pubstatus'); if(el){ el.textContent=publishStatusText(); el.className='small'+(/^Error/.test(ghMeta().status||'')?' err':''); } const b=document.getElementById('publish'); if(b){ b.disabled=!ghToken()||publishing; b.textContent=publishing?'Publishing…':'Publish to website'; } }

  else if(t.id==='webexport'){ const b=new Blob([JSON.stringify(makePub())],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progress.json';a.click();return;}

// ---------- achievements / celebrations ----------
function achNow(){
  const A={}; let tot=0; const NV=new Set(neverList().map(x=>x.n));
  REGIONS.forEach(r=>{
    const k=counts(r), g=V(r), bv=BV(r), cu=catchup(r); tot+=k.got;
    if(k.can&&k.got>=k.can) A['dex:'+g.key]={ic:'📕',title:'Pokédex complete!',sub:`Every catchable ${r.name} Pokémon caught in ${g.game}`,mon:r.range[0]};
    if(k.can&&k.h>=k.can) A['home:'+g.key]={ic:'🏠',title:'All moved to HOME!',sub:`${r.name}'s ${k.can} Pokémon are safe in Pokémon HOME`,mon:r.range[0]};
    { let fill=0,need=0,full=true; for(let n=r.range[0];n<=r.range[1];n++){ if(S.dex[n]) fill++; else full=false; if(!NV.has(n)){ need++; } } const filledReach=[...Array(r.range[1]-r.range[0]+1).keys()].every(i=>{const n=r.range[0]+i;return S.dex[n]||NV.has(n);});
      if(filledReach&&!full) A['region:'+r.id]={ic:'🗺️',title:`${r.name} dex filled!`,sub:`Every ${r.name} Pokémon you can catch on the journey${k.vo?` (${k.vo} from other games)`:''}`,mon:r.range[1]};
      if(full){ A['region:'+r.id]=A['region:'+r.id]||{ic:'🗺️',title:`${r.name} dex filled!`,sub:`All ${k.total} ${r.name} Pokémon`,mon:r.range[1]}; A['full:'+r.id]={ic:'💯',title:`${r.name} 100%!`,sub:`All ${k.total} ${r.name} Pokémon, even the uncatchable ones`,mon:r.range[1]}; } }
    if(cu.list.length&&cu.done>=cu.list.length) A['cu:'+g.key]={ic:'🟣',title:'Catch-up complete!',sub:`All ${cu.list.length} missing Pokémon from earlier regions caught in ${g.game}`,mon:cu.list[cu.list.length-1]};
    const nb=g.bosses.length; if(nb&&bv.beat[nb-1]) A['champ:'+g.key]={ic:'👑',title:r.id==='hisui'?'Arceus awaits!':'Champion!',sub:`${g.bosses[nb-1][0]} defeated in ${g.game}`,mon:(findNum((S.regions[r.id].hof.team[1]||{}).mon)||findNum((S.regions[r.id].hof.team[0]||{}).mon)||0)};
    (S.regions[r.id].shinies||[]).forEach(x=>{ A['sh:'+x.t]={ic:'✨',title:'Shiny found!',sub:x.nick?`${x.nick} the ${x.mon}`:(x.mon||'A shiny!'),mon:findNum(x.mon)||0,shiny:true}; });
  });
  const L=neverList(); if(L.length&&L.every(x=>S.dex[x.n])) A.never={ic:'🚫',title:'The impossible ones!',sub:`All ${L.length} uncatchable Pokémon obtained`,mon:L[0].n};
  [100,250,500,750,1000].forEach(m=>{ if(tot>=m) A['tot:'+m]={ic:'🎉',title:`${m} Pokémon!`,sub:`${m} caught in their own games`,mon:0}; });
  return A;
}
function checkAch(){

}

function toastTick(){

function chime(sh){ try{ const C=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)()); const notes=sh?[1318,1568,1976,2637]:[523,659,784,1047]; notes.forEach((f,i)=>{ const o=C.createOscillator(), g=C.createGain(); o.type=sh?'sine':'triangle'; o.frequency.value=f; const t0=C.currentTime+i*.12; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.18,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+.5); o.connect(g).connect(C.destination); o.start(t0); o.stop(t0+.55); }); }catch(e){} }
