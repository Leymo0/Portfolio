<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Living Dex Journey — Leymo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12142a; --panel:#1b1e3a; --panel2:#232750; --line:rgba(255,255,255,.08);
  --text:#e9ebff; --muted:#9aa0c8; --accent:#ff6b6b; --accent2:#ffd166; --good:#5ee0a0; --bad:#ff5d73; --home:#7cc4ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--text)}
body.control{background:var(--bg)}
body.overlay{background:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- CONTROL ---------- */
header{position:sticky;top:0;z-index:5;background:rgba(18,20,42,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;letter-spacing:.3px}
.brand span{color:var(--accent)}
.total{color:var(--muted);font-size:13px}
.bank{margin-left:auto;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,93,115,.15);color:#ffb3bf;border:1px solid rgba(255,93,115,.35)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.tab small{color:var(--muted);font-weight:700}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1a1020}
.tab.on small{color:#3b1a22}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tab .dot.done{background:var(--good)}
.tab .dot.ds{background:#ffb3bf}
main{padding:14px;display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.gname{font-size:20px;font-weight:900;margin:0}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin:6px 6px 0 0}
.chip.warn{background:rgba(255,93,115,.18);color:#ffb3bf}
.small{font-size:13px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:800;font-size:13px}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1020}
input[type=number],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
input[type=number]{width:80px}
.capbox{display:flex;gap:12px;align-items:stretch;margin:4px 0 10px}
.capbig{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.capbig .lbl{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.capbig .val{font-size:26px;font-weight:900}
.status{font-weight:900;border-radius:10px;padding:8px 10px;text-align:center;margin-top:8px}
.status.ok{background:rgba(94,224,160,.15);color:var(--good)}
.status.over{background:rgba(255,93,115,.18);color:var(--bad)}
.boss{display:grid;grid-template-columns:22px 1fr 64px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px}
.boss.next{background:rgba(255,209,102,.12);outline:1px solid rgba(255,209,102,.4)}
.boss.beat .bn{text-decoration:line-through;color:var(--muted)}
.boss input[type=number]{width:64px;padding:4px 6px}
.boss input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.bosses{max-height:360px;overflow:auto;margin-top:6px}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--accent2)} .bar .h{background:var(--home)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters .btn.on{background:var(--accent2);color:#2a2000;border-color:var(--accent2)}
.fam{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2);margin-bottom:8px;flex-wrap:wrap}
.fam .need{min-width:150px;font-weight:900;font-size:14px}
.fam .need small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.mons{display:flex;gap:6px;flex-wrap:wrap}
.mon{width:84px;border-radius:10px;background:var(--bg);border:2px solid transparent;padding:4px;text-align:center;cursor:pointer;position:relative;user-select:none}
.mon img{width:56px;height:56px;image-rendering:pixelated;filter:grayscale(1) brightness(.55);opacity:.7}
.mon .nm{font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .no{font-size:10px;color:var(--muted)}
.mon.s1{border-color:var(--accent2)} .mon.s1 img{filter:none;opacity:1}
.mon.s2{border-color:var(--home)} .mon.s2 img{filter:none;opacity:1}
.mon .tag{position:absolute;top:3px;right:3px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.mon .tag.M{background:rgba(255,93,115,.25);color:#ffb3bf}
.mon .tag.L{background:rgba(255,209,102,.2);color:var(--accent2)}
.mon .tag.D{background:rgba(124,196,255,.2);color:var(--home)}
.mon .st{position:absolute;top:3px;left:3px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:5px}
.mon.s1 .st{background:var(--accent2);color:#2a2000}
.mon.s2 .st{background:var(--home);color:#06223a}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:6px 0}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.shinyrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.shinyrow img{width:56px;height:56px;image-rendering:pixelated}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
ol.help{padding-left:18px;margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.55}

/* ---------- OVERLAY ---------- */
.ov{width:440px;margin:10px;padding:14px 16px 12px;border-radius:18px;background:rgba(18,20,42,.86);border:2px solid rgba(255,107,107,.55);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.ov-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ov-region{font-weight:900;font-size:22px;letter-spacing:.5px}
.ov-region span{color:var(--accent)}
.ov-game{font-size:13px;color:var(--muted);font-weight:800;text-align:right}
.ov-sec{margin-top:10px}
.ov-lbl{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.ov-dexnum{font-weight:900;font-size:18px}
.ov-dexnum small{font-size:12px;color:var(--muted);font-weight:800}
.ov-cap{display:flex;gap:8px;align-items:center}
.ov-cap .boss-n{flex:1;font-weight:900;font-size:16px;line-height:1.15}
.ov-cap .boss-n small{display:block;font-size:12px;color:var(--muted)}
.ov-pill{font-weight:900;font-size:15px;padding:6px 10px;border-radius:12px;background:var(--panel2);text-align:center;line-height:1.1}
.ov-pill small{display:block;font-size:10px;color:var(--muted);letter-spacing:.8px}
.ov-pill.ok{background:rgba(94,224,160,.18);color:var(--good)}
.ov-pill.over{background:rgba(255,93,115,.22);color:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,93,115,.25)}}
.ov-bottom{display:flex;gap:10px;align-items:center;margin-top:10px}
.ov-bottom img{width:48px;height:48px;image-rendering:pixelated}
.ov-mini{flex:1;font-size:13px;font-weight:800}
.ov-mini small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.ov-bank{margin-top:8px;font-size:12px;font-weight:900;color:#ffb3bf;text-align:center}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.how{margin-top:8px;display:grid;gap:3px;width:100%}
.how div{font-size:12px;color:var(--muted);line-height:1.35}
.how b{color:var(--text);font-weight:800}
.k{display:inline-block;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;margin-right:4px;vertical-align:1px}
.k.wild{background:rgba(94,224,160,.15);color:var(--good)}
.k.evolve,.k.breed{background:rgba(255,255,255,.08);color:var(--text)}
.k.trade{background:rgba(124,196,255,.18);color:var(--home)}
.k.exclusive,.k.none{background:rgba(255,93,115,.2);color:#ffb3bf}
.k.event{background:rgba(255,93,115,.2);color:#ffb3bf}
.k.special,.k.dlc{background:rgba(255,209,102,.18);color:var(--accent2)}
.mon.cant img{opacity:.35}
.cantlist{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 0 8px}
.cantlist b{color:var(--text)}
table.rw{width:100%;border-collapse:collapse;font-size:12px}
table.rw td{padding:4px 2px;border-top:1px solid var(--line);color:var(--muted);vertical-align:top}
table.rw td:last-child{color:var(--accent2);font-weight:800;text-align:right;white-space:nowrap}
select.var{width:auto;margin-top:8px}
.hrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.hrow img,.hrow .himg{width:40px;height:40px;flex:0 0 40px;image-rendering:pixelated}
.hrow input[type=text]{padding:5px 8px;min-width:0}
.hlab{flex:0 0 64px;font-size:12px;font-weight:900;color:var(--muted)}
.hlab.hi{color:var(--accent2)}
.hsh{display:flex;align-items:center;gap:2px;font-size:13px;cursor:pointer}
.hsh input{accent-color:var(--accent2)}
.hf{width:860px;margin:10px;padding:18px 20px;border-radius:20px;background:rgba(18,20,42,.9);border:2px solid rgba(255,209,102,.6)}
.hf-title{font-size:26px;font-weight:900}
.hf-game{color:var(--muted);font-weight:800;font-size:14px}
.hf-team{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.hf-slot{background:var(--panel2);border-radius:14px;padding:8px 6px 10px;text-align:center;border:2px solid transparent}
.hf-slot.mvp{border-color:var(--accent2);background:rgba(255,209,102,.12)}
.hf-slot img,.hf-empty{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto}
.hf-empty{line-height:96px;font-size:30px;color:var(--muted)}
.hf-tag{font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--accent2)}
.hf-nick{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hf-sp{font-size:11px;color:var(--muted);font-weight:800;min-height:14px}
.hf-hml{margin-top:14px;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hf-hms{display:flex;gap:10px;margin-top:6px}
.hf-hm{flex:1;display:flex;gap:6px;align-items:center;background:var(--panel2);border-radius:12px;padding:6px 10px;font-size:14px}
.hf-hm img{width:48px;height:48px;image-rendering:pixelated}
.hf-hm span{color:var(--muted);font-size:12px}
.hf-hm small{display:block;color:var(--muted);font-size:12px}
.hf.hf-pub{width:auto;margin:0 0 14px}
.hf.hf-pub .hf-team{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.hf.hf-pub .hf-hms{flex-wrap:wrap}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.pfam{display:flex;gap:4px;padding:6px;border-radius:12px;background:var(--panel2)}
</style>
</head>

const REMOTE_SPRITE = (n,sh) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${sh?'shiny/':''}${n}.png`;
const SPRITE = (n,sh) => `sprites/${sh?'shiny/':''}${n}.png`;
window.addEventListener('error',e=>{ const im=e.target; if(!im||im.tagName!=='IMG') return; const m=(im.getAttribute('src')||'').match(/^sprites\/(shiny\/)?(\d+)\.png$/); if(m&&!im.dataset.fb){ im.dataset.fb=1; im.src=REMOTE_SPRITE(m[2],!!m[1]); } else { im.style.visibility='hidden'; } },true);
const KIND = {wild:'CATCH',evolve:'EVOLVE',breed:'BREED',trade:'TRADE EVO',exclusive:'NOT IN THIS VERSION',event:'EVENT',none:'NOT IN GAME',special:'SPECIAL',dlc:'DLC'};
const CANT = new Set(['exclusive','event','none']);

// ---------- data prep ----------
const SP = {}; SPECIES.forEach(([num,name,root,prevo,tag]) => SP[num] = {num,name,root,prevo,tag});
function depth(n){let d=0,s=SP[n];while(s&&s.prevo){d++;s=SP[s.prevo];}return d;}
function regionOf(n){return REGIONS.find(r=>n>=r.range[0]&&n<=r.range[1]);}
REGIONS.forEach(r=>{
  const fams={};
  for(let n=r.range[0];n<=r.range[1];n++){ if(!SP[n]) continue; (fams[SP[n].root] ||= []).push(n); }
  r.families = Object.values(fams).map(members=>{
    members.sort((a,b)=>depth(a)-depth(b)||a-b);
    const first = SP[members[0]];
    let base = first, evolve = false;
    if(first.prevo && first.prevo < r.range[0]){ let s=first; while(s.prevo && s.prevo < r.range[0]) s=SP[s.prevo]; base=s; evolve=true; }
    return {members, base:base.num, evolve, minNum:Math.min(...members)};
  }).sort((a,b)=>a.minNum-b.minNum);
  r.total = r.range[1]-r.range[0]+1;
});

// ---------- state ----------
function blankHof(){return {team:Array.from({length:6},()=>({mon:'',nick:'',shiny:false})),hm:Array.from({length:3},()=>({mon:'',nick:'',note:''})),date:''};}
function blankRegion(){return {bv:{},team:'',shinies:[],variant:null,hof:blankHof()};}
function blank(){
  const s={active:'kanto',dex:{},regions:{},overlay:{dex:true,cap:true,shiny:true,bank:true,last:true},last:null,filter:'all',search:''};
  REGIONS.forEach(r=>s.regions[r.id]=blankRegion());
  return s;
}
function load(){try{let raw=localStorage.getItem(KEY); if(!raw){ const old=localStorage.getItem('livingdex-journey-v1'); if(old){ const o=JSON.parse(old), n=blank(); n.dex=o.dex||{}; n.active=o.active||'kanto'; n.last=o.last||null; Object.assign(n.overlay,o.overlay||{}); for(const id in (o.regions||{})) if(n.regions[id]){ n.regions[id].team=o.regions[id].team||''; if(o.regions[id].shiny&&o.regions[id].shiny.done) n.regions[id].shinies=[{mon:o.regions[id].shiny.mon||'',nick:'',t:Date.now()}]; } raw=JSON.stringify(n);} } if(raw){const s=Object.assign(blank(),JSON.parse(raw)); REGIONS.forEach(r=>{s.regions[r.id]=Object.assign(blankRegion(),s.regions[r.id]||{}); const rg=s.regions[r.id]; if(!Array.isArray(rg.shinies)) rg.shinies=[]; if(rg.shiny&&rg.shiny.done&&!rg.shinies.length) rg.shinies.push({mon:rg.shiny.mon||'',nick:'',t:Date.now()}); delete rg.shiny; rg.hof=Object.assign(blankHof(),rg.hof||{});}); s.overlay=Object.assign(blank().overlay,s.overlay||{}); return s;}}catch(e){} return blank();}
let S = load();
let lastRaw = null;
function save(){ if(VIEW==='public') return; try{ const raw=JSON.stringify(S); lastRaw=raw; localStorage.setItem(KEY,raw);}catch(e){} }

// ---------- helpers ----------
const R = id => REGIONS.find(r=>r.id===id);
function V(r){const k=S.regions[r.id].variant; return r.variants.find(v=>v.key===k)||r.variants[0];}
function BV(r){const st=S.regions[r.id], k=V(r).key; st.bv[k] ||= {beat:{},lv:{}}; return st.bv[k];}
function bossLevel(r,i){const v=BV(r).lv[i]; return (v!==undefined&&v!=='')?+v:V(r).bosses[i][1];}
function nextBoss(r){
  const b=BV(r), list=V(r).bosses; const idx=list.map((x,i)=>i).filter(i=>!b.beat[i]);
  if(!idx.length) return null;
  if(r.open) idx.sort((a,c)=>bossLevel(r,a)-bossLevel(r,c)||a-c);
  const i=idx[0]; return {i,name:list[i][0],lv:bossLevel(r,i),cap:bossLevel(r,i)-1};
}
function how(r,n){return V(r).how[n]||['none','No data'];}
function counts(r){let c=0,h=0,can=0;for(let n=r.range[0];n<=r.range[1];n++){const v=S.dex[n];if(v===1)c++;else if(v===2)h++; if(!CANT.has(how(r,n)[0])) can++;}return {c,h,got:c+h,total:r.total,can};}
function daysLeft(){return Math.max(0,Math.ceil((BANK_END-Date.now())/86400000));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function findNum(name){name=name.trim().toLowerCase(); const s=SPECIES.find(x=>x[1].toLowerCase()===name); return s?s[0]:null;}

function hofHtml(r,extra){
  const g=V(r), h=S.regions[r.id].hof;
  const card=(x,i)=>{const n=findNum(x.mon); return `<div class="hf-slot ${i===1?'mvp':''}"><div class="hf-tag">${i===0?'★ Starter':i===1?'👑 MVP':'#'+(i+1)}</div>${n?`<img src="${SPRITE(n,x.shiny)}" alt="">`:'<div class="hf-empty">?</div>'}<div class="hf-nick">${esc(x.nick||x.mon||'—')}${x.shiny?' ✨':''}</div><div class="hf-sp">${x.nick?esc(x.mon):''}</div></div>`;};
  const hm=h.hm.filter(x=>x.mon||x.nick).map(x=>{const n=findNum(x.mon);return `<div class="hf-hm">${n?`<img src="${SPRITE(n)}" alt="">`:''}<div><b>${esc(x.nick||x.mon)}</b>${x.nick&&x.mon?` <span>(${esc(x.mon)})</span>`:''}${x.note?`<small>${esc(x.note)}</small>`:''}</div></div>`;}).join('');
  return `<div class="hf ${extra||''}"><div class="hf-head"><div><div class="hf-title">🏆 ${esc(r.name)} Hall of Fame</div><div class="hf-game">${esc(g.game)}${h.date?' · '+esc(h.date):''}</div></div></div><div class="hf-team">${h.team.map(card).join('')}</div>${hm?`<div class="hf-hml">Honorable mentions</div><div class="hf-hms">${hm}</div>`:''}</div>`;
}
function renderHof(){ const html=hofHtml(R(S.active)); if(html!==prevHof){document.getElementById('app').innerHTML=html; prevHof=html;} }

// ---------- public read-only page (website) ----------
let PUB={tab:null,filter:'all',updated:null,err:null,loaded:false};
function loadPublic(){
  fetch('progress.json?t='+Date.now()).then(r=>{if(!r.ok) throw new Error(r.status); return r.json();}).then(d=>{
    const s=blank(); s.dex=d.dex||{}; s.active=d.active||'kanto';
    for(const id in (d.regions||{})) if(s.regions[id]) Object.assign(s.regions[id],d.regions[id]);
    REGIONS.forEach(r=>{const rg=s.regions[r.id]; rg.hof=Object.assign(blankHof(),rg.hof||{}); if(!Array.isArray(rg.shinies)) rg.shinies=[]; rg.bv=rg.bv||{};});
    S=s; PUB.updated=d.updated; PUB.loaded=true; if(!PUB.tab) PUB.tab=s.active; renderPublic();
  }).catch(e=>{PUB.err=String(e); PUB.loaded=true; renderPublic();});
}
function renderPublic(){
  const app=document.getElementById('app');

function cantSummary(r){
  const groups={exclusive:[],event:[],none:[]};
  for(let n=r.range[0];n<=r.range[1];n++){const k=how(r,n)[0]; if(groups[k]) groups[k].push(SP[n].name);}
  const g=V(r), parts=[];
  if(groups.exclusive.length) parts.push(`<div class="cantlist"><b>Other version only (${groups.exclusive.length}):</b> ${groups.exclusive.map(esc).join(', ')}</div>`);
  if(groups.event.length) parts.push(`<div class="cantlist"><b>Event only (${groups.event.length}):</b> ${groups.event.map(esc).join(', ')}</div>`);
  if(groups.none.length) parts.push(`<div class="cantlist"><b>Not in ${esc(g.game)} (${groups.none.length}):</b> ${groups.none.map(esc).join(', ')}</div>`);
  return parts.join('')||'<p class="small">Everything from this region can be obtained in this game. 🎉</p>';
}

let delArm=null;
function confirmDel(x){ if(delArm===x){delArm=null;return true;} delArm=x; setTimeout(()=>{if(delArm===x)delArm=null;},3000); const b=document.querySelectorAll('[data-delshiny]'); b.forEach(el=>{ if(S.regions[S.active].shinies[+el.dataset.delshiny]===x) el.textContent='Sure?'; }); return false; }
document.addEventListener('click',e=>{
  if(VIEW!=='control') return;
  const t=e.target.closest('[data-tab],[data-mon],[data-filter],[data-team],[data-delshiny],#addshiny,#export,#import,#webexport');
  if(!t) return;
  const st=S.regions[S.active];
  if(t.dataset.tab){S.active=t.dataset.tab;S.search='';}
  else if(t.dataset.mon){const n=+t.dataset.mon,v=((S.dex[n]||0)+1)%3; if(v) S.dex[n]=v; else delete S.dex[n]; if(v===1) S.last={num:n,t:Date.now()};}
  else if(t.dataset.filter){S.filter=t.dataset.filter;}
  else if(t.dataset.team){st.team=String((+st.team||0)+1);}
  else if(t.dataset.delshiny!==undefined){ if(!confirmDel(st.shinies[+t.dataset.delshiny])) return; st.shinies.splice(+t.dataset.delshiny,1); }
  else if(t.id==='addshiny'){ const m=document.getElementById('shmon').value.trim(), nk=document.getElementById('shnick').value.trim(); if(!m){document.getElementById('shmon').focus();return;} const n=findNum(m); st.shinies.push({mon:n?SP[n].name:m,nick:nk,t:Date.now()}); }
  else if(t.id==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='livingdex-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();return;}
  else if(t.id==='webexport'){ const pub={updated:new Date().toISOString(),active:S.active,dex:S.dex,regions:{}}; for(const id in S.regions){ const x=S.regions[id]; pub.regions[id]={variant:x.variant,bv:x.bv,shinies:x.shinies,hof:x.hof,team:x.team}; } const b=new Blob([JSON.stringify(pub)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progress.json';a.click();return;}
  else if(t.id==='import'){document.getElementById('file').click();return;}
  const y=window.scrollY; save(); renderControl(); window.scrollTo(0,y);
});
document.addEventListener('change',e=>{
  if(VIEW!=='control') return;
  const t=e.target, r=R(S.active), st=S.regions[S.active], bv=BV(r);
  if(t.dataset.beat!==undefined){ if(t.checked) bv.beat[t.dataset.beat]=1; else delete bv.beat[t.dataset.beat]; }
  else if(t.dataset.lv!==undefined){ const def=V(r).bosses[t.dataset.lv][1]; if(t.value===''||+t.value===def) delete bv.lv[t.dataset.lv]; else bv.lv[t.dataset.lv]=+t.value; }
  else if(t.dataset.ov){ S.overlay[t.dataset.ov]=t.checked; }
  else if(t.id==='variant'){ st.variant=t.value; }
  else if(t.id==='team'){ st.team=t.value; }
  else if(t.dataset.hof!==undefined){ const x=st.hof.team[+t.dataset.hof], f=t.dataset.f; if(f==='shiny') x.shiny=t.checked; else if(f==='mon'){ const n=findNum(t.value); x.mon=n?SP[n].name:t.value.trim(); } else x[f]=t.value; }
  else if(t.dataset.hm!==undefined){ const x=st.hof.hm[+t.dataset.hm], f=t.dataset.f; if(f==='mon'){ const n=findNum(t.value); x.mon=n?SP[n].name:t.value.trim(); } else x[f]=t.value; }
  else if(t.id==='hofdate'){ st.hof.date=t.value; }
  else if(t.dataset.nick!==undefined){ st.shinies[+t.dataset.nick].nick=t.value; }
  else if(t.id==='shmon'||t.id==='shnick'){ return; }
  else if(t.id==='file'){ const f=t.files[0]; if(!f) return; f.text().then(txt=>{try{const d=JSON.parse(txt); if(!d.regions||!d.dex) throw 0; localStorage.setItem(KEY,JSON.stringify(d)); S=load(); save(); renderControl();}catch(err){alert('That file is not a Living Dex backup.');}}); return; }
  else return;
  const y=window.scrollY; save(); renderControl(); window.scrollTo(0,y);
});
document.addEventListener('keydown',e=>{ if(VIEW!=='overlay'&&e.key==='Enter'&&(e.target.id==='shmon'||e.target.id==='shnick')){ e.preventDefault(); document.getElementById('addshiny').click(); } });
let searchTimer;
document.addEventListener('input',e=>{
  if(VIEW==='overlay'||e.target.id!=='search') return;
  clearTimeout(searchTimer); const v=e.target.value;
  searchTimer=setTimeout(()=>{S.search=v; save(); renderControl(); const s=document.getElementById('search'); s.focus(); s.setSelectionRange(v.length,v.length);},250);
});

// ---------- sync between the OBS dock and the overlay ----------
function pull(){ if(VIEW==='public') return; try{ const raw=localStorage.getItem(KEY); if(raw&&raw!==lastRaw){ lastRaw=raw; S=load(); if(VIEW==='overlay') renderOverlay(); else if(VIEW==='hof') renderHof(); else { const a=document.activeElement; if(!a||!/INPUT|SELECT/.test(a.tagName)) renderControl(); } } }catch(e){} }
window.addEventListener('storage',e=>{ if(e.key===KEY) pull(); });
setInterval(pull, 800);
setInterval(()=>{ if(VIEW==='overlay') renderOverlay(); }, 60000);
try{ lastRaw=localStorage.getItem(KEY); }catch(e){}
if(VIEW==='public'){ renderPublic(); loadPublic(); setInterval(loadPublic,120000); } else render();

</script>
</body>
</html>
